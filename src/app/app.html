<!-- No bar, no background: just the links, floating over the top-right corner. The Globe / Map / Scatter switch lives in
     the explorer's left column (explorer.html), above the search. -->
<header class="site-header">
  @if (!onExplorer()) {
    <a routerLink="/">Explore</a>
  } @else {
    <!-- Lesson 17: the scroll-driven story -->
    <a routerLink="/story">Story</a>
  }
  <!-- Opens the roadmap in the lesson window: only the named outlet changes, the current page stays -->
  <a [routerLink]="[{ outlets: { lesson: ['lessons'] } }]" title="Lessons (L)">Lessons</a>
</header>

<main class="site-main">
  <router-outlet />
</main>

<app-lesson-window />
<app-dock-bar />
