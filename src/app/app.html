<!-- No bar, no background: just the actions, floating over the top-right corner of the globe or map -->
<header class="site-header">
  @if (onExplorer()) {
    <div class="view-switch" role="group" aria-label="View">
      <button type="button" [class.is-active]="state.view() === 'globe'" [attr.aria-pressed]="state.view() === 'globe'" [disabled]="!state.webgl()" (click)="state.show('globe')">Globe</button>
      <button type="button" [class.is-active]="state.view() === 'map'" [attr.aria-pressed]="state.view() === 'map'" (click)="state.show('map')">Map</button>
    </div>
    <!-- Lesson 13: open or close the scatter plot window -->
    <div class="view-switch">
      <button type="button" [class.is-active]="state.scatter()" [attr.aria-pressed]="state.scatter()" (click)="state.showScatter(!state.scatter())">Scatter</button>
    </div>
  } @else {
    <a routerLink="/">Explore</a>
  }
  <!-- Opens the roadmap in the lesson window: only the named outlet changes, the current page stays -->
  <a [routerLink]="[{ outlets: { lesson: ['lessons'] } }]" title="Lessons (L)">Lessons</a>
</header>

<main class="site-main">
  <router-outlet />
</main>

<app-lesson-window />
<app-dock-bar />
