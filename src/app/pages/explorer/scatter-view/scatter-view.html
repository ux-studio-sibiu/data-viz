<section class="nsc-scatter-view" aria-label="Wealth and emissions">
  @if (loading()) {
    <p class="status">Loading…</p>
  } @else {
    <app-scatter-plot class="plot" [points]="points()" [title]="'Wealth × CO₂ in ' + chartYear()" xLabel="GDP per person" yLabel="CO₂ per person (t)" xPrefix="$" [label]="label()" [xDomain]="ranges()?.x ?? null" [yDomain]="ranges()?.y ?? null" [sizeMax]="ranges()?.sizeMax ?? null" [(hovered)]="state.hovered" [selected]="state.selected()" (pick)="state.select($event)">
      <!-- The hovered country's figures, in the plot's tooltip -->
      @if (active(); as a) {
        <span scatter-tooltip>
          <span class="card-title">{{ a.name }}</span>
          <!-- One row per figure: label, a dotted leader, value -->
          <span class="card-row"><span>GDP per person</span><span class="leader"></span><strong>{{ a.gdp }}</strong></span>
          <span class="card-row"><span>CO₂ per person</span><span class="leader"></span><strong>{{ a.co2 }}</strong></span>
          <span class="card-row"><span>Population</span><span class="leader"></span><strong>{{ a.people }}</strong></span>
        </span>
      }
    </app-scatter-plot>
  }

</section>
